[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qviewbone"
version = "0.1.0"
description = "Controlled cross-view VQA experiments with a portable Colab workflow"
requires-python = ">=3.10"
dependencies = ["tomli>=2; python_version < '3.11'"]

[project.optional-dependencies]
vlm = ["torch>=2.5,<3", "torchvision>=0.20", "transformers==4.57.1", "accelerate>=1.2,<2", "Pillow>=10", "bitsandbytes>=0.45,<1"]

[project.scripts]
qviewbone = "qviewbone.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
