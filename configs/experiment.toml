[paths]
# Empty data_dir discovers ../vqa-dataset, then ./data/raw.
# Relative settings paths are resolved against QVB_ROOT, never the current cwd.
data_dir = ""
image_dir = ""
prepared_dir = "data/prepared"
output_dir = "outputs"
pair_review = ""

[model]
id = "Qwen/Qwen2.5-VL-3B-Instruct"
revision = "main"
device = "auto"
dtype = "auto"
quantization = "none" # none or 4bit; 4bit requires a CUDA runtime
min_pixels = 50176
max_pixels = 401408 # 512 * 28 * 28; fixed within a comparison
max_new_tokens = 128
attention = "sdpa"

[experiment]
seed = 42
categories = ["C1.1", "C1.2", "C1.3", "C2.1"]
conditions = ["A", "B", "AB", "BA", "A_to_B", "B_to_A"]
max_pairs = 30 # 0 = all pairs
train_fraction = 0.7
val_fraction = 0.15
bootstrap_samples = 1000
